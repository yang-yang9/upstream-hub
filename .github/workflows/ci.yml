name: CI

# 提交到 dev 或提 PR 时跑编译/类型/lint/单测，快速挡住低级错误。
# publish.yml 的 Docker 构建慢（十几分钟），这里 3-4 分钟先出结果。
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  backend:
    name: Backend (go vet / build / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  frontend:
    name: Frontend (typecheck / lint / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable && corepack prepare pnpm@10.4.0 --activate

      - name: pnpm install
        run: pnpm install --no-frozen-lockfile

      - name: typecheck
        run: pnpm exec tsc --noEmit

      - name: lint
        run: pnpm lint

      - name: build
        run: pnpm build
