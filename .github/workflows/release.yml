name: Release Binaries

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.4.0 --activate

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Prepare frontend embed
        run: |
          rm -rf backend/web/dist
          cp -r frontend/dist backend/web/dist

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          cd backend
          LDFLAGS="-s -w -X github.com/worryzyy/upstream-hub/internal/version.Version=${VERSION} -X github.com/worryzyy/upstream-hub/internal/version.Commit=${COMMIT} -X github.com/worryzyy/upstream-hub/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o upstream-hub ./cmd/server
          tar czf upstream-hub-linux-amd64.tar.gz upstream-hub
          rm upstream-hub

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o upstream-hub ./cmd/server
          tar czf upstream-hub-linux-arm64.tar.gz upstream-hub
          rm upstream-hub

      - name: Generate checksums
        working-directory: backend
        run: sha256sum upstream-hub-linux-*.tar.gz > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            backend/upstream-hub-linux-amd64.tar.gz
            backend/upstream-hub-linux-arm64.tar.gz
            backend/checksums.txt
